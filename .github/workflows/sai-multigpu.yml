name: SAI multi-GPU regression

on:
  # The VM timer in tools/sai/scheduler requests this workflow hourly.
  workflow_dispatch:
    inputs:
      force:
        description: Retest unchanged upstream develop
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sai-multigpu
  cancel-in-progress: false

jobs:
  regression:
    if: github.repository == 'Stardust0831/lammps'
    runs-on: [self-hosted, Linux, X64, sai-lammps-vm]
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: tools/sai
      - name: Check numerical and reporting failure gates
        run: python3 -B -m unittest discover -s tools/sai -p 'test_*.py' -v
      - name: Submit or resume the SAI MPI/GPU tests
        id: test
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python3 -u -B tools/sai/relay.py "${args[@]}"
      - name: Preserve raw inputs, outputs and allocation evidence
        if: always() && steps.test.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sai-multigpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Publish completed results, including failures
        id: report
        if: always() && steps.test.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/sai/publish.py
      - name: Upload the public report website
        id: website
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/
      - name: Deploy the public report website
        id: deployment
        if: always() && steps.website.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Acknowledge published results
        if: always() && steps.deployment.outcome == 'success'
        run: python3 -B tools/sai/relay.py --ack
